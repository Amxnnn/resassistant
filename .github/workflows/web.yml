name: web

# Runs only when the web app or the contract changes, so agent/ changes never touch these checks.
on:
  pull_request:
    paths:
      - "web/**"
      - "contracts/**"
      - ".github/workflows/web.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "contracts/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Placeholder until the web app exists. Lint, type-check, unit and contract tests are added in week 1.
      - run: echo "No web checks yet."
