name: agent

# Runs only when the agent or the contract changes, so web/ changes never touch these checks.
on:
  pull_request:
    paths:
      - "agent/**"
      - "contracts/**"
      - ".github/workflows/agent.yml"
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "contracts/**"
      - ".github/workflows/agent.yml"

permissions:
  contents: read

concurrency:
  group: agent-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: agent

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: agent/uv.lock
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest -q
